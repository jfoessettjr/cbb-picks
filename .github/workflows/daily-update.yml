name: Daily Odds Refresh
on:
  schedule:
    - cron: '0 15 * * *' # Runs daily at 10:00 AM EST (15:00 UTC)
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node scripts/fetch-odds.js
        env:
          VITE_ODDS_API_KEY: ${{ secrets.VITE_ODDS_API_KEY }}
      - name: Commit and push updated picks
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git commit -am "Daily automated picks refresh" || exit 0
          git push
