name: Daily Odds Refresh

on:
  schedule:
    - cron: '0 15 * * *' # Runs daily at 10:00 AM EST (15:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run odds fetcher script
        run: node scripts/fetch-odds.js
        env:
          VITE_ODDS_API_KEY: ${{ secrets.VITE_ODDS_API_KEY }}

      - name: Commit and push updated picks
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add public/picks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily automated picks refresh" && git push)
